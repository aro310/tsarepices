[build]
  base = "frontend"
  command = "npm run build -- --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Explicitly run the Next.js adapter so Netlify generates server functions,
# image handling and routing, instead of publishing raw build files.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Configure external Flask service URLs in the Netlify environment settings:
# CONTACT_SERVICE_URL, CATALOG_SERVICE_URL, ORDERS_SERVICE_URL.
# Do not use localhost URLs in production.
